[package]
name = "voice-control"
version = "2.3.1"
edition = "2024"
default-run = "voice-control"
license = "MIT"
repository = "https://github.com/anomalyco/hex"

# Crates imported from Scrawl live under `crates/`. Plain `cargo build` and
# `cargo test` still select only Hex; pass `--workspace` or `-p` for the others.
# `crates/capture` is excluded so `--workspace` never builds it: it compiles
# only as the `capture` feature's macOS dependency, and `-p scrawl-capture`
# tests and lints it. The root package is a member without being listed;
# listing "." would defeat `exclude`.
[workspace]
members = ["crates/router"]
exclude = ["crates/capture"]

[[test]]
name = "keyboard_layout"
harness = false

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
onnx-benchmark = ["dep:transcribe-rs"]
# The `capture` experiment's engine (Scrawl's `scrawl-capture`, macOS only): a
# build option (`HEX_CAPTURE=1 scripts/build-app.sh`), off by default and in
# every public build, which never compile it or its Swift helper.
capture = ["dep:scrawl-capture", "dep:anyhow"]

[profile.moonshine-lab]
inherits = "release"
debug-assertions = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
hound = "3.5.1"
libc = "0.2.189"
libloading = "0.9.0"
regex = "1.13.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
rubato = "5.0.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-cpp = "=0.4.0"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", rev = "e37c66b6df43af51fde8dec34f98a07aaf09564c", features = ["onnx"], optional = true }
unicode-segmentation = "1.13.3"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = { version = "1.0.104", optional = true }
arboard = { version = "3.6.1", default-features = false }
block2 = "0.6.2"
core-graphics-types = "0.1.3"
core-video = "0.4.3"
crossterm = "0.29.0"
metal = "0.29.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
# Smart Turn: loads the ONNX Runtime dylib Moonshine already ships.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-23"] }
ratatui = "0.30.2"
realfft = "3.5.0"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
scrawl-capture = { path = "crates/capture", default-features = false, features = ["screen", "helper"], optional = true }
tokio = { version = "1.53.1", features = ["rt", "io-std"] }
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
gio = "0.18.4"
glib = "0.18.5"
transcribe-cpp = { version = "=0.4.0", features = ["vulkan"] }
x11-clipboard = "0.9.3"
x11rb = { version = "0.14.0", features = ["xtest"] }

# The desktop UI.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "028d08d5570d6f0415532b41ec3518e943c67ad0" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "028d08d5570d6f0415532b41ec3518e943c67ad0" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "028d08d5570d6f0415532b41ec3518e943c67ad0" }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
png = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tray-icon = { version = "0.24.1", default-features = false }
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-future = "0.3.2"

# x64 Windows decodes on the GPU through Vulkan. ARM64 Windows stays CPU-only,
# as Handy ships it: ggml's ARM CPU backend needs clang-cl, and Vulkan drivers
# on Windows-on-ARM are not a dependable target yet.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "=0.4.0", features = ["vulkan"] }
