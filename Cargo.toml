[package]
name = "voice-control"
version = "2.3.1"
edition = "2024"
default-run = "voice-control"
license = "MIT"
repository = "https://github.com/anomalyco/hex"

[[test]]
name = "keyboard_layout"
harness = false

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
onnx-benchmark = ["dep:transcribe-rs"]

[profile.moonshine-lab]
inherits = "release"
debug-assertions = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
hound = "3.5.1"
libc = "0.2.189"
libloading = "0.9.0"
regex = "1.13.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
rubato = "5.0.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-cpp = "=0.4.0"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", rev = "e37c66b6df43af51fde8dec34f98a07aaf09564c", features = ["onnx"], optional = true }
unicode-segmentation = "1.13.3"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false }
block2 = "0.6.2"
core-graphics-types = "0.1.3"
core-video = "0.4.3"
crossterm = "0.29.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-symbols = { version = "0.6.1", default-features = false, features = ["component", "cache"] }
image = { version = "0.25.10", default-features = false }
metal = "0.29.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
ratatui = "0.30.2"
raw-window-handle = "0.6.2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
tokio = { version = "1.53.1", features = ["rt", "io-std"] }
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.23.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
ed25519-dalek = "3.0.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
gtk = "0.18.2"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
transcribe-cpp = { version = "=0.4.0", features = ["vulkan"] }
x11-clipboard = "0.9.3"
x11rb = { version = "0.14.0", features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
image = { version = "0.25.10", default-features = false }
raw-window-handle = "0.6.2"
tray-icon = { version = "0.24.1", default-features = false }
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-future = "0.3.2"

# x64 Windows decodes on the GPU through Vulkan. ARM64 Windows stays CPU-only,
# as Handy ships it: ggml's ARM CPU backend needs clang-cl, and Vulkan drivers
# on Windows-on-ARM are not a dependable target yet.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "=0.4.0", features = ["vulkan"] }

# GPUI 0.2.2 plus:
# 1. Wayland XKB early-return when key/modifier events arrive before any keymap (from Hona/gpui a0c6474).
# 2. macOS CAMetalLayer sRGB colorspace tag, triangular gradient/shadow dithering,
#    luminance glyph dilation (Zed #54886), and CVDisplayLinkCreateWithCGDisplay fallback.
# 3. macOS: release the window-state lock before resignKeyWindow (opening a window
#    while inactive deadlocked the main thread), and focus-free pop-ups never become key.
[patch.crates-io]
gpui = { git = "https://github.com/kitlangton/gpui", rev = "2e52b98886063ddfa828312c83415a14208dfe87" }
