[package]
name = "voice-control"
version = "2.1.2"
edition = "2024"
default-run = "voice-control"
license = "MIT"
repository = "https://github.com/anomalyco/hex"

[build-dependencies]
cc = "1"

[features]
onnx-benchmark = ["dep:transcribe-rs"]

[profile.moonshine-lab]
inherits = "release"
debug-assertions = true

[dependencies]
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.1"
ctrlc = "3.5.2"
crossterm = "0.29.0"
dirs = "6.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
hound = "3.5.1"
libc = "0.2.177"
libloading = "0.9.0"
ratatui = "0.30.2"
regex = "1.12.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-cpp = "=0.1.3"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", rev = "e37c66b6df43af51fde8dec34f98a07aaf09564c", features = ["onnx"], optional = true }
unicode-segmentation = "1.13.3"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-graphics-types = "0.1.3"
core-video = "0.4.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-symbols = { version = "0.6.1", default-features = false, features = ["component", "cache"] }
metal = "0.29.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
raw-window-handle = "0.6.2"
screencapturekit = { version = "=8.0.1", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
ed25519-dalek = "2.2.0"
evdev = "0.13.2"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
gtk = "0.18.2"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
semver = "1.0.28"
tray-icon = { version = "0.24.1", default-features = false, features = ["gtk"] }
transcribe-cpp = { version = "=0.1.3", features = ["vulkan"] }
x11-clipboard = "0.9.3"
x11rb = { version = "0.13.2", features = ["xtest"] }
