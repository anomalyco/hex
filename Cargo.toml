[package]
name = "voice-control"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.1"
ctrlc = "3.5.2"
crossterm = "0.29.0"
dirs = "6.0.0"
fs2 = "0.4.3"
hound = "3.5.1"
libloading = "0.9.0"
ratatui = "0.30.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics-types = "0.1.3"
core-video = "0.4.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
metal = "0.29.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
raw-window-handle = "0.6.2"
screencapturekit = { version = "=8.0.0", features = ["macos_15_0"] }
