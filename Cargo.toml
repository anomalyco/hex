[package]
name = "voice-control"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.1"
crossterm = "0.29.0"
dirs = "6.0.0"
libloading = "0.9.0"
ratatui = "0.30.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
url = "2.5.8"
