name: Release TypeScript SDK

# Pending changesets on dev open (or update) the "chore: release TypeScript
# SDK" pull request into dev, which bumps versions and changelogs. Dispatch
# this workflow on dev to publish an unreleased SDK version and tag it.
on:
  push:
    branches: [dev]
    paths:
      - "sdk/**"
      - ".github/workflows/release-typescript.yml"
  workflow_dispatch:

# Finish an in-flight publish before another run checks registry availability.
concurrency:
  group: release-typescript-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          cwd: sdk
          pr-title: "chore: release TypeScript SDK"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Exact, never latest: trusted publishing needs npm 11.5+.
      - run: npm install --global npm@12.2.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: bun run release
      - name: Push tags and create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD --list '@kitlangton/hex@*'); do
            git push origin "refs/tags/$tag"
            awk -v heading="## ${tag##*@}" '$0 == heading { on = 1; next } /^## / && on { exit } on' \
              typescript/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            # The app's stable release is Latest; an SDK release never takes it.
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          done
