name: Legacy appcast

# Replaces the frozen 2.3.1 appcast (https://anoma.ly/hex/files/appcast.xml,
# which Kit-era Macs read through Kit's redirect) with
# packaging/macos/legacy-appcast.xml: one informational item, with no
# enclosure, that points those installs at https://anoma.ly/hex. Run it when
# that item changes (docs/releasing.md, "Old clients").
# The job holds the R2 key, so it checks out only .github/release/ and the
# appcast, which it treats as data, and uploads with .github/release/r2-put.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HEX_RELEASE_BUCKET: hex-production-files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /.github/release/
            /packaging/macos/legacy-appcast.xml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the appcast
        run: |
          appcast=packaging/macos/legacy-appcast.xml
          python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' "$appcast"
          grep -Fq '<sparkle:informationalUpdate' "$appcast"
          grep -Fq 'https://anoma.ly/hex' "$appcast"
          curl -fsS https://anoma.ly/hex/files/appcast.xml -o live.xml
          { echo '### Live → new appcast'; echo '```diff'; diff -u live.xml "$appcast" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/hex-release
          role-session-name: hex-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the release secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            R2_SECRET_ACCESS_KEY,hex/release/R2_SECRET_ACCESS_KEY
          parse-json-secrets: false
      - name: Upload it
        env:
          R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
        run: |
          sh .github/release/r2-put.sh appcast.xml packaging/macos/legacy-appcast.xml application/xml no-cache
          curl -fsS -H 'Cache-Control: no-cache' "https://anoma.ly/hex/files/appcast.xml?check=$(date +%s)" \
            | cmp - packaging/macos/legacy-appcast.xml
