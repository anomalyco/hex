name: Site

# Pull requests run no site check (CI is minimal; the deploy builds the site
# and checks every download link). A push (or a dispatch) on dev deploys the
# dev site (https://dev.anoma.ly/hex); on
# production, which moves only by a fast-forward from dev, the production
# site (https://anoma.ly/hex). The mode always follows the branch.
on:
  push:
    branches: [dev, production]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/site-deploy.yml"
      - ".github/release/deploy-site.sh"
      - ".github/release/cf/**"
      - ".github/release/install-linux.sh"
      - ".github/release/install-windows.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/production'
    uses: ./.github/workflows/site-deploy.yml
    with:
      mode: ${{ github.ref == 'refs/heads/production' && 'production' || 'dev' }}
    secrets: inherit
