name: Site deploy

# Builds site/ for one environment and deploys its Worker (the site at /hex and
# the files at /hex/files: built installers and appcast, the dev notes, and the
# frozen 2.3.1 bucket): dev -> https://dev.anoma.ly/hex,
# production -> https://anoma.ly/hex. Split like Release (docs/releasing.md):
#
# - build runs repository code (bun install, site/scripts/build.ts) with no
#   environment and no secrets, and uploads the Worker's Build Output with a
#   SHA256SUMS whose digest it reports.
# - deploy runs in the release environment, which reads the hex-site-deploy
#   token from AWS Secrets Manager. It checks out only .github/release/,
#   verifies the artifact against that digest, and runs only
#   .github/release/deploy-site.sh, which pins the Worker, routes, and
#   bindings and deploys with the cf CLI locked in .github/release/cf/.
# - verify checks the live site and every download link without secrets.
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      # The checks the Installers and Legacy appcast workflows ran before they
      # uploaded these files to the bucket. The site now serves them, so a
      # broken installer or appcast fails the deploy instead.
      - name: Check the legacy appcast
        run: |
          python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' ../packaging/macos/legacy-appcast.xml
          grep -Fq '<sparkle:informationalUpdate' ../packaging/macos/legacy-appcast.xml
          grep -Fq 'https://anoma.ly/hex' ../packaging/macos/legacy-appcast.xml
      - name: Test the installers
        run: |
          sh ../scripts/test-install-linux-release.sh
          pwsh -NoProfile -Command "[void][ScriptBlock]::Create((Get-Content -Raw ../.github/release/install-windows.ps1))"
      - name: Build
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in dev|production) ;; *) exit 1 ;; esac
          bun run build --mode "$MODE"
          # Vite's build manifest is not deployed, and artifacts drop hidden files.
          rm -r .cloudflare/output/v0/workers/default/bundle/.vite
      - id: upload
        uses: ./.github/release/upload
        with:
          name: site-${{ inputs.mode }}
          path: site/.cloudflare/output
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: site-deploy-${{ inputs.mode }}
      cancel-in-progress: false
    steps:
      - name: Require the branch for the mode
        env:
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
        run: |
          case "$MODE:$REF" in
            production:refs/heads/production | dev:refs/heads/dev) ;;
            *) echo "::error::The $MODE site deploys only from its own branch, not $REF."; exit 1 ;;
          esac
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pinned cf CLI
        working-directory: .github/release/cf
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: site-${{ inputs.mode }}
          digests: site-${{ inputs.mode }}=${{ needs.build.outputs.digest }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/hex-release
          role-session-name: hex-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the release secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,hex/release/CLOUDFLARE_API_TOKEN
          parse-json-secrets: false
      - name: Deploy
        env:
          MODE: ${{ inputs.mode }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/release/deploy-site.sh "$MODE" "$RUNNER_TEMP/in/site-$MODE"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Check the live site and every download link
        env:
          MODE: ${{ inputs.mode }}
        run: |
          host=$([ "$MODE" = dev ] && echo dev.anoma.ly || echo anoma.ly)
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://$host/hex/")
            [ "$status" = 200 ] && break
            sleep 10
          done
          test "$status" = 200
          bun scripts/release-data.ts --mode "$MODE"
          bun run check:downloads
      - name: Check the files the site serves
        env:
          MODE: ${{ inputs.mode }}
        run: |
          host=$([ "$MODE" = dev ] && echo dev.anoma.ly || echo anoma.ly)
          for name in install-linux.sh install-windows.ps1 appcast.xml; do
            curl -fsS "https://$host/hex/files/$name?check=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/$name"
          done
          cmp "$RUNNER_TEMP/install-linux.sh" ../.github/release/install-linux.sh
          cmp "$RUNNER_TEMP/install-windows.ps1" ../.github/release/install-windows.ps1
          cmp "$RUNNER_TEMP/appcast.xml" ../packaging/macos/legacy-appcast.xml
