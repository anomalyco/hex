name: AUR key check

# Confirms the AUR accepts the release key (github-actions-hex-aur) by listing
# the account's packages. Run it after adding or rotating the key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/hex-release
          role-session-name: hex-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the release secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            AUR_SSH_PRIVATE_KEY,shared/AUR_SSH_KEY
          parse-json-secrets: false
      - name: List the AUR account's packages with the key
        shell: bash
        run: bash .github/release/push-aur.sh check | tee -a "$GITHUB_STEP_SUMMARY"
