name: Release

# Builds, signs, and publishes Hex for macOS, Windows, and Linux from one
# exact commit to the Anomaly release service (docs/releasing.md,
# docs/plans/release-service.md). The service authorizes this workflow file
# by its GitHub OIDC token: repository anomalyco/hex, and the release-dev
# environment from dev (dev channel only) or the release environment from
# production or app-v* (anomalyco/release registry/hex.json). Hex never
# publishes to or reads from the service's dev stage, dev.anoma.ly/release,
# which only tests the service itself.
#
# production holds what was released and only moves by a fast-forward from
# dev. Run stable from production or push an app-v tag.
#
# channel=check (the dispatch default) builds, signs, and verifies every
# platform as <next>-dev.<run number> and publishes nothing. channel=stable
# (or an app-v<version> tag) publishes to https://anoma.ly/release, the
# GitHub release, the AUR, Homebrew, and the production site.
#
# channel=dev publishes a build of dev, stamped <next>-dev.<run number>, to
# the production service's dev channel (https://anoma.ly/release), where
# installs set to the Dev update channel and the site's /hex/download/dev
# link pick it up. Every push to dev that changes more than docs or the site
# runs it, and a newer push cancels a dev run still in progress. It runs in
# the release-dev environment, which needs no approval and which the service
# lets publish only the dev channel. It publishes only signed builds: a
# platform whose signing isn't configured in release-dev (macOS: the Apple
# secrets; Windows: Azure Artifact Signing) is left out, with a note in the
# summary. It touches nothing else: no GitHub release, AUR, Homebrew, Nix
# record, or site deploy. <next> is the crate version, or its next patch once
# that version has an app-v tag, so a dev build is always newer than the
# stable release before it and switching back to Stable never downgrades.
#
# check also runs in release-dev (for its signing values); stable runs in
# release, which waits for a reviewer.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to release
        required: true
        default: production
      channel:
        description: check (build and verify, publish nothing), dev (the dev channel; run from dev), or stable (public)
        type: choice
        options: [check, dev, stable]
        default: check
  push:
    branches: [dev]
    tags: ["app-v*"]
    # Docs and the site alone cut no dev build (tag pushes ignore paths).
    paths-ignore: ["docs/**", "site/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_type == 'tag' && 'stable' || 'dev' }}
  # Only the dev channel: a newer push supersedes a dev build in progress.
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_type == 'tag' && 'stable' || 'dev') == 'dev' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      service: ${{ steps.resolve.outputs.service }}
      tag: ${{ steps.resolve.outputs.tag }}
      notes-url: ${{ steps.resolve.outputs.notes-url }}
      release-channel: ${{ steps.resolve.outputs.release-channel }}
      release-version: ${{ steps.resolve.outputs.release-version }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_type == 'tag' && 'stable' || 'dev' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "voice-control") | .version')
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Stable releases need an X.Y.Z version, not $version."
            exit 1
          fi
          if [ "$CHANNEL" = stable ] && [ "$REF_TYPE" != tag ] && [ "$REF_NAME" != production ]; then
            echo "::error::Stable releases run from production or an app-v tag, not $REF_NAME."
            exit 1
          fi
          if { [ "$CHANNEL" = dev ] || [ "$CHANNEL" = check ]; } && [ "$REF_NAME" != dev ]; then
            echo "::error::The $CHANNEL channel runs from dev, not $REF_NAME."
            exit 1
          fi
          # A dispatch builds inputs.ref, not the branch it runs from, so check
          # that too: dev builds dev; stable builds production or its app-v tag.
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$CHANNEL" = dev ] && [ "$INPUT_REF" != dev ]; then
              echo "::error::The dev channel builds ref dev, not $INPUT_REF."
              exit 1
            fi
            if [ "$CHANNEL" = stable ] && [ "$INPUT_REF" != production ] && [ "$INPUT_REF" != "app-v$version" ]; then
              echo "::error::Stable releases build ref production or app-v$version, not $INPUT_REF."
              exit 1
            fi
          fi
          if [ "$EVENT:$REF_TYPE" = push:tag ] && [ "$REF_NAME" != "app-v$version" ]; then
            echo "::error::Tag $REF_NAME does not match version $version."
            exit 1
          fi
          case "$CHANNEL" in
            stable)
              service=https://anoma.ly/release tag="app-v$version"
              notes="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
              release_channel=stable release_version=$version
              ;;
            dev | check)
              # Once X.Y.Z is released (tagged), dev builds are X.Y.(Z+1)-dev.N,
              # which SemVer orders above X.Y.Z.
              # ls-remote exits 2 only when the tag is absent; any other
              # failure stops the run rather than stamp a version below it.
              status=0
              git ls-remote --exit-code origin "refs/tags/app-v$version" >/dev/null || status=$?
              case "$status" in
                0) base=$(printf '%s\n' "$version" | awk -F. '{ print $1 "." $2 "." $3 + 1 }') ;;
                2) base=$version ;;
                *) echo "::error::Could not look up tag app-v$version (git ls-remote exited $status)."; exit 1 ;;
              esac
              service=https://anoma.ly/release tag="dev-$GITHUB_RUN_ID"
              notes="https://github.com/$GITHUB_REPOSITORY/commit/$sha"
              release_channel=dev release_version="$base-dev.$GITHUB_RUN_NUMBER"
              ;;
            *) echo "::error::Unknown channel $CHANNEL."; exit 1 ;;
          esac
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "channel=$CHANNEL"
            echo "service=$service"
            echo "tag=$tag"
            echo "notes-url=$notes"
            echo "release-channel=$release_channel"
            echo "release-version=$release_version"
            echo "environment=$([ "$CHANNEL" = stable ] && echo release || echo release-dev)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version ($CHANNEL) from $sha to $service as $release_channel $release_version." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-desktop.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.release-version }}
      signing-environment: ${{ needs.resolve.outputs.environment }}
    # Azure Artifact Signing (OIDC); the values live in the signing environment.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}

  macos:
    needs: resolve
    uses: ./.github/workflows/build-macos.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.release-version }}
      # The Apple secrets live in this environment.
      environment: ${{ needs.resolve.outputs.environment }}
      optional: ${{ needs.resolve.outputs.channel != 'stable' }}

  # Collects every platform's files into one artifact and checks them. Stable
  # needs every platform signed; dev publishes only signed platforms; check
  # reports what it built.
  collect:
    needs: [resolve, build, macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hex-*-*
          path: dist
          merge-multiple: true
      - name: Check the release files
        run: |
          for name in hex-$HEX_VERSION-linux-x64 \
            Hex-$HEX_VERSION-windows-x64.exe Hex-Setup-$HEX_VERSION-windows-x64.exe \
            Hex-$HEX_VERSION-windows-arm64.exe Hex-Setup-$HEX_VERSION-windows-arm64.exe; do
            test -s "dist/$name" || { echo "::error::dist/$name is missing."; exit 1; }
          done
          test "$(head -c 4 "dist/hex-$HEX_VERSION-linux-x64" | od -An -tx1 | tr -d ' ')" = 7f454c46
          for exe in dist/*.exe; do
            test "$(head -c 2 "$exe")" = MZ
          done
          if [ ! -f "dist/Hex-$HEX_VERSION-macos-arm64.zip" ]; then
            if [ "$CHANNEL" = stable ]; then
              echo "::error::Stable releases need the macOS build."
              exit 1
            fi
            echo "::notice::No macOS build in this run (no Apple signing secrets); it publishes no macOS targets."
            echo "No macOS targets: the macOS build needs the Apple signing secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd dist && ls -l && sha256sum *) | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require Authenticode signatures (stable fails; dev drops unsigned Windows targets)
        run: |
          sudo apt-get install -y -qq osslsigncode >/dev/null
          unsigned=
          for exe in dist/*.exe; do
            if osslsigncode extract-signature -in "$exe" -out "$RUNNER_TEMP/signature" >/dev/null 2>&1; then
              echo "Signed: $(basename "$exe")" >> "$GITHUB_STEP_SUMMARY"
            else
              unsigned="$unsigned $(basename "$exe")"
            fi
            rm -f "$RUNNER_TEMP/signature"
          done
          if [ -n "$unsigned" ]; then
            if [ "$CHANNEL" = stable ]; then
              echo "::error::Stable releases need Authenticode-signed Windows executables:$unsigned"
              exit 1
            fi
            if [ "$CHANNEL" = dev ]; then
              # The updater refuses unsigned Windows builds, so dev publishes none.
              rm -f dist/*.exe
              echo "::notice::Windows builds are not Authenticode-signed; this dev release has no Windows targets."
              echo "No Windows targets: Azure Artifact Signing is not configured in release-dev." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Unsigned Windows executables:$unsigned"
            fi
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  # The only job that can publish: its OIDC token carries the environment the
  # service requires (release for stable, release-dev for dev). No
  # other credentials reach it.
  publish:
    needs: [resolve, collect]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.resolve.outputs.channel != 'check' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.resolve.outputs.service }}
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      HEX_RELEASE_CHANNEL: ${{ needs.resolve.outputs.release-channel }}
    outputs:
      linux-url: ${{ steps.publish.outputs.linux-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - id: publish
        env:
          NOTES_URL: ${{ needs.resolve.outputs.notes-url }}
        run: |
          scripts/release-service.sh publish dist "$NOTES_URL"
          echo "linux-url=${RELEASE%/release}$(jq -r '.release.targets["linux-x64"].url' dist/manifest.json)" >> "$GITHUB_OUTPUT"
          { echo '### Manifest'; echo '```json'; cat dist/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the Nix flake
        # The flake builds this commit from source, so it serves the version now.
        if: needs.resolve.outputs.channel == 'stable'
        run: scripts/release-service.sh distribution nix "$HEX_VERSION"

  github:
    name: GitHub release
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.resolve.outputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      HEX_RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
      HEX_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      HEX_RELEASE_SOURCE: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      # Credentials stay so a stable release can push its tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/scripts/publish-github-release.sh dist

  aur:
    name: AUR
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.resolve.outputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      LINUX_URL: ${{ needs.publish.outputs.linux-url }}
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git openssh
          useradd --create-home builder
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Stage and test hex-bin
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          runuser -u builder -- tools/scripts/release-aur.sh stage "$HEX_VERSION" "dist/hex-$HEX_VERSION-linux-x64" "$LINUX_URL" aur
          runuser -u builder -- tools/scripts/release-aur.sh test aur
          pacman -U --noconfirm aur/hex-bin-*.pkg.tar.zst
          test "$(hex --version | awk 'NF { value=$NF } END { print value }')" = "$HEX_VERSION"
          # The PKGBUILD's source is the published file.
          curl -fsS "$LINUX_URL" | cmp - "dist/hex-$HEX_VERSION-linux-x64"
          { echo '### AUR PKGBUILD'; echo '```'; cat aur/PKGBUILD; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: tools/scripts/release-aur.sh publish aur

  # Tells AUR installs about the version only once the AUR serves it.
  record-aur:
    needs: [resolve, aur]
    if: ${{ !cancelled() && needs.aur.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.resolve.outputs.service }}
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      HEX_RELEASE_CHANNEL: ${{ needs.resolve.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release-service.sh distribution aur "$HEX_VERSION"

  # Renders the cask from the published DMG, checks it with brew, and pushes
  # it to anomalyco/homebrew-tap with the tap's deploy key.
  homebrew:
    name: Homebrew
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.resolve.outputs.channel == 'stable' }}
    runs-on: macos-15
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.resolve.outputs.service }}
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the cask from the published DMG
        run: |
          curl -fsS "$RELEASE/hex/desktop/$RELEASE_CHANNEL.json" -o manifest.json
          version=$(jq -er .release.version manifest.json)
          test "$version" = "$HEX_VERSION"
          dmg=$(jq -ec '.release.targets["macos-arm64-dmg"]' manifest.json) || {
            echo "::error::Hex $version has no macos-arm64-dmg build."
            exit 1
          }
          url="${RELEASE%/release}$(printf '%s' "$dmg" | jq -r .url)"
          sha256=$(printf '%s' "$dmg" | jq -r .sha256)
          scripts/release-homebrew.sh render "$version" "$url" "$sha256" hex.rb
          { echo '### Casks/hex.rb'; echo '```ruby'; cat hex.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check it with brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap anomalyco/tap
          cp hex.rb "$(brew --repo anomalyco/tap)/Casks/hex.rb"
          brew style --cask anomalyco/tap/hex
          brew audit --cask --strict --online anomalyco/tap/hex
      - name: Push to anomalyco/homebrew-tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: scripts/release-homebrew.sh publish hex.rb "$HEX_VERSION"

  # Tells Homebrew installs about the version only once the tap serves it.
  record-brew:
    needs: [resolve, homebrew]
    if: ${{ !cancelled() && needs.homebrew.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.resolve.outputs.service }}
      HEX_VERSION: ${{ needs.resolve.outputs.release-version }}
      HEX_RELEASE_CHANNEL: ${{ needs.resolve.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release-service.sh distribution brew "$HEX_VERSION"

  site:
    name: Deploy the production site
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.resolve.outputs.channel == 'stable' }}
    uses: ./.github/workflows/site-deploy.yml
    with:
      mode: production
    secrets: inherit
