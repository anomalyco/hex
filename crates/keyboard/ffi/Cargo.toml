[package]
name = "hex-keyboard-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# libhex_keyboard.a for iOS, libhex_keyboard.so for Android (and the host JVM test).
name = "hex_keyboard"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Android IME's JNI entry points (ly.anoma.hex.typing.KeyboardCore).
jni = ["dep:jni"]

[dependencies]
hex-keyboard-core = { path = "../core" }
memmap2 = "0.9"
# fcntl, to duplicate a caller's descriptor (hk_model_open_fd); already in the lock via memmap2.
libc = "0.2"
jni = { version = "0.21", optional = true, default-features = false }

[lints]
workspace = true
