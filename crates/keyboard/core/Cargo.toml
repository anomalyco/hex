[package]
name = "hex-keyboard-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hex_keyboard_core"

[dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
# The parity fixtures (tests/swipe_parity.rs, tests/tap_parity.rs) and the replay benchmark's
# sets are JSON Lines; the swipe fixture also checks the models' SHA-256.
serde_json = "1"
sha2 = "0.10"
# The tap benchmark (examples/tap_replay) reads the Android benchmark's gzipped held-out sets.
flate2 = "1"

[lints]
workspace = true
