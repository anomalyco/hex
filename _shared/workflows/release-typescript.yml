name: Release TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/release-typescript.yml"
  workflow_dispatch:

# Finish an in-flight publish before another run checks registry availability.
concurrency:
  group: release-typescript
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          cwd: sdk
          publish-script: bun run release
          pr-title: "chore: release TypeScript SDK"
