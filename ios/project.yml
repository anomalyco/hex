name: HEXMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: anomaly.hex
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: 5NZ4Q7NXJ4
    SWIFT_VERSION: 6.0
    # The compiler finds the interface's strings for the String Catalogs (Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  HEXMobile:
    type: application
    platform: iOS
    sources:
      - HEXMobile
      - HEXShared
      - HEXActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: HEXKeyboard
        embed: true
      - target: HEXWidgets
        embed: true
    info:
      path: HEXMobile/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        # Typing configs (`.mhexconfig`, ios/TypingConfig): a file tapped in Files or opened
        # from a share sheet opens Hex. Conforms to public.data, not public.json: a JSON-typed
        # file AirDropped to an iPhone previews as text and never reaches the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Hex typing config
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - anomaly.hex.typing-config
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: anomaly.hex.typing-config
            UTTypeDescription: Hex typing config
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mhexconfig
              public.mime-type:
                - application/vnd.anomaly.hex-typing-config
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: anomaly.hex.mobile.keyboard-session
            CFBundleURLSchemes:
              - hex-dictation
        NSMicrophoneUsageDescription: Hex turns what you say into text on this iPhone. Audio never leaves it and is deleted once it's transcribed.
        NSSpeechRecognitionUsageDescription: Hex uses Apple's on-device speech recognition to turn what you say into text. Nothing you say is sent to a server.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HEXMobile/HEXMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels
        OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-autolink-framework -Xfrontend FoundationModels
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile
        PRODUCT_NAME: HEX
    scheme:
      gatherCoverageData: false
      testTargets:
        - HEXMobileTests
  HEXKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - HEXKeyboard
      - HEXShared
      # The app's String Catalog, so the keyboard's words (the Hex key menu first) follow
      # the iPhone's language where Hex is translated.
      - HEXMobile/Localizable.xcstrings
    dependencies:
      # Experiments › Speech model in keyboard: Parakeet in the keyboard (KeyboardParakeet).
      - package: FluidAudio
    info:
      path: HEXKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Hex Keyboard
        NSMicrophoneUsageDescription: Hex turns what you say into text on this iPhone. Audio never leaves it and is deleted once it's transcribed.
        NSSpeechRecognitionUsageDescription: Hex uses Apple's on-device speech recognition to turn what you say into text. Nothing you say is sent to a server.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: HEXKeyboard/HEXKeyboard.entitlements
        COREML_CODEGEN_LANGUAGE: None
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile.keyboard
        PRODUCT_NAME: HEXKeyboard
        SKIP_INSTALL: YES
  HEXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HEXWidgets
      - HEXActivity
      - HEXShared/HexTheme.swift
    info:
      path: HEXWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile.widgets
        PRODUCT_NAME: HEXWidgets
        SKIP_INSTALL: YES
  HEXMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HEXMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-hex-1.wav
        buildPhase: resources
    dependencies:
      - target: HEXMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HEX