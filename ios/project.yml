name: HEXMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: anomaly.hex
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: 5NZ4Q7NXJ4
    SWIFT_VERSION: 6.0
    # The compiler finds the interface's strings for the String Catalogs (Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The keyboard's Rust core is built for arm64 only (build-keyboard-core.sh), and so is
    # every simulator build: no Intel simulators.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  HEXMobile:
    type: application
    platform: iOS
    sources:
      - HEXMobile
      - HEXShared
      - HEXActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: HEXKeyboard
        embed: true
      - target: HEXWidgets
        embed: true
    info:
      path: HEXMobile/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: anomaly.hex.mobile.keyboard-session
            CFBundleURLSchemes:
              - hex-dictation
        NSMicrophoneUsageDescription: Hex turns what you say into text on this iPhone. Audio never leaves it and is deleted once it's transcribed.
        NSSpeechRecognitionUsageDescription: Hex uses Apple's on-device speech recognition to turn what you say into text. Nothing you say is sent to a server.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HEXMobile/HEXMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        # libhex_keyboard.a, which HEXKeyboard (a dependency) builds, for HEXShared's code.
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels -lhex_keyboard
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/build/keyboard-core/$(PLATFORM_NAME)
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/../crates/keyboard/ffi/include
        OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-autolink-framework -Xfrontend FoundationModels
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile
        PRODUCT_NAME: HEX
    scheme:
      gatherCoverageData: false
      testTargets:
        - HEXMobileTests
  HEXKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - HEXKeyboard
      - HEXShared
      # The app's String Catalog, so the keyboard's words (the Hex key menu first) follow
      # the iPhone's language where Hex is translated.
      - HEXMobile/Localizable.xcstrings
    dependencies:
      # Experiments › Speech model in keyboard: Parakeet in the keyboard (KeyboardParakeet).
      - package: FluidAudio
    # The keyboard core (libhex_keyboard.a) for both HEXKeyboard and HEXMobile.
    preBuildScripts:
      - name: Build the keyboard core
        script: '"$PROJECT_DIR/scripts/build-keyboard-core.sh"'
        # Cargo tracks the core's sources itself, so the phase runs every build.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/build/keyboard-core/$(PLATFORM_NAME)/libhex_keyboard.a
    info:
      path: HEXKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Hex Keyboard
        NSMicrophoneUsageDescription: Hex turns what you say into text on this iPhone. Audio never leaves it and is deleted once it's transcribed.
        NSSpeechRecognitionUsageDescription: Hex uses Apple's on-device speech recognition to turn what you say into text. Nothing you say is sent to a server.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        # The keyboard core's script phase runs Cargo, which reads crates/keyboard and
        # ~/.cargo and writes build/keyboard-core: more than a sandboxed script may touch.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: HEXKeyboard/HEXKeyboard.entitlements
        OTHER_LDFLAGS: $(inherited) -lhex_keyboard
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/build/keyboard-core/$(PLATFORM_NAME)
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/../crates/keyboard/ffi/include
        COREML_CODEGEN_LANGUAGE: None
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile.keyboard
        PRODUCT_NAME: HEXKeyboard
        SKIP_INSTALL: YES
  HEXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HEXWidgets
      - HEXActivity
      - HEXShared/HexTheme.swift
    info:
      path: HEXWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile.widgets
        PRODUCT_NAME: HEXWidgets
        SKIP_INSTALL: YES
  HEXMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HEXMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-hex-1.wav
        buildPhase: resources
      # SwipeFixtureTests' golden readings, which crates/keyboard/core/tests/swipe_parity.rs reads too.
      - path: ../crates/keyboard/core/tests/fixtures/swipe-parity.jsonl
        buildPhase: resources
    dependencies:
      - target: HEXMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/../crates/keyboard/ffi/include
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: anomaly.hex.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HEX