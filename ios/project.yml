name: HEXMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.kitlangton.hex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: QC99C9JE59
    SWIFT_VERSION: 6.0
targets:
  HEXMobile:
    type: application
    platform: iOS
    sources:
      - HEXMobile
      - HEXShared
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: HEXKeyboard
        embed: true
    info:
      path: HEXMobile/Info.plist
      properties:
        CFBundleDisplayName: HEX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.kitlangton.hex.mobile.keyboard-session
            CFBundleURLSchemes:
              - hex-dictation
        NSMicrophoneUsageDescription: HEX records only while you dictate and transcribes the recording locally on this iPhone.
        NSSpeechRecognitionUsageDescription: HEX uses Apple's on-device SpeechTranscriber to turn your temporary recording into text.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HEXMobile/HEXMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile
        PRODUCT_NAME: HEX
    scheme:
      gatherCoverageData: false
  HEXKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - HEXKeyboard
      - HEXShared
    info:
      path: HEXKeyboard/Info.plist
      properties:
        CFBundleDisplayName: HEX Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: HEXKeyboard/HEXKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.keyboard
        PRODUCT_NAME: HEXKeyboard
        SKIP_INSTALL: YES
