name: HEXMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.kitlangton.hex
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: QC99C9JE59
    SWIFT_VERSION: 6.0
targets:
  HEXMobile:
    type: application
    platform: iOS
    sources:
      - HEXMobile
      - HEXShared
      - HEXActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: HEXKeyboard
        embed: true
      - target: HEXWidgets
        embed: true
    info:
      path: HEXMobile/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.kitlangton.hex.mobile.keyboard-session
            CFBundleURLSchemes:
              - hex-dictation
        NSMicrophoneUsageDescription: Hex records only while you dictate and transcribes locally on this iPhone.
        NSSpeechRecognitionUsageDescription: Hex uses Apple's on-device SpeechTranscriber to turn your recording into text.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HEXMobile/HEXMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile
        PRODUCT_NAME: HEX
    scheme:
      gatherCoverageData: false
      testTargets:
        - HEXMobileTests
  HEXKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - HEXKeyboard
      - HEXShared
    info:
      path: HEXKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Hex Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: HEXKeyboard/HEXKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.keyboard
        PRODUCT_NAME: HEXKeyboard
        SKIP_INSTALL: YES
  HEXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HEXWidgets
      - HEXActivity
      - HEXShared/HexTheme.swift
    info:
      path: HEXWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.widgets
        PRODUCT_NAME: HEXWidgets
        SKIP_INSTALL: YES
  HEXMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HEXMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-hex-1.wav
        buildPhase: resources
    dependencies:
      - target: HEXMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HEX
