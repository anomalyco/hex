# Each test runs in its own process. A test still running after
# `period * terminate-after` is killed and reported by name as TIMEOUT.
[profile.default]
slow-timeout = { period = "15s", terminate-after = 2 }
status-level = "slow"
final-status-level = "fail"
failure-output = "final"
fail-fast = false

[profile.default.junit]
path = "junit.xml"

[test-groups]
gpu = { max-threads = 2 }
# The Windows updater tests each start powershell.exe, which is slow to start
# on CI and slower on ARM; they run one at a time.
windows-shell = { max-threads = 1 }

# The first run's motion gate records 30 headless windows: a minute alone,
# more on a busy machine.
[[profile.default.overrides]]
filter = "test(motion_gate::the_first_run_moves_cleanly)"
test-group = "gpu"
slow-timeout = { period = "60s", terminate-after = 2 }

# Rune scenes render on the GPU; the driver test compiles the C plug-in.
[[profile.default.overrides]]
filter = "test(/scene|golden|rune_ui::/) | test(driver_plugin_loopback)"
test-group = "gpu"
slow-timeout = { period = "30s", terminate-after = 2 }

# CI runners are slower and render on software Vulkan.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2 }
failure-output = "immediate-final"

[[profile.ci.overrides]]
filter = "test(/scene|golden|rune_ui::/) | test(driver_plugin_loopback)"
test-group = "gpu"
slow-timeout = { period = "90s", terminate-after = 2 }

# The PowerShell updater tests get four minutes before nextest kills them, and
# never run beside each other.
[[profile.ci.overrides]]
filter = "test(authenticode_requires_a_valid_signature_from_the_expected_signer) | test(shortcuts_pointing_at_an_old_version_are_retargeted) | test(a_zero_filled_managed_shortcut_is_recreated)"
test-group = "windows-shell"
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
